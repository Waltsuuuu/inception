services:
  mariadb:
    # Build the image using our own MariaDB Dockerfile.
    image: mariadb
    build: ./requirements/mariadb

    # Name the container.
    container_name: mariadb

    # Restart the container if it stops unexpectedly.
    restart: unless-stopped

    # Pass database settings from the .env file.
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}

    # Make password files available inside the container.
    secrets:
      - db_root_password
      - db_password

    # Store database files in a persistent Docker volume.
    volumes:
      - mariadb_data:/var/lib/mysql

    # Connect MariaDB to our internal Docker network.
    networks:
      - inception

  wordpress:
    # Build WordPress using our own Dockerfile.
    image: wordpress
    build: ./requirements/wordpress

    container_name: wordpress
    restart: unless-stopped

    # Pass WordPress and database settings from .env.
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      WP_URL: ${WP_URL}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_USER: ${WP_USER}
      WP_USER_EMAIL: ${WP_USER_EMAIL}

    # Make the database and administrator passwords available.
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password

    # Store WordPress files in a persistent volume.
    volumes:
      - wordpress_data:/var/www/html

    # Connect WordPress to the same network as MariaDB.
    networks:
      - inception

    # Start MariaDB before WordPress.
    depends_on:
      - mariadb

  nginx:
    # Build NGINX using our own Dockerfile.
    image: nginx
    build: ./requirements/nginx

    container_name: nginx
    restart: unless-stopped

    # Expose HTTPS to the host.
    ports:
      - "443:443"

    # Share the WordPress files with NGINX.
    volumes:
      - wordpress_data:/var/www/html:ro

    # Connect NGINX to our internal network.
    networks:
      - inception

    # Start WordPress before NGINX.
    depends_on:
      - wordpress

# Define the password files used by MariaDB and WordPress.
secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt

  db_password:
    file: ../secrets/db_password.txt

  wp_admin_password:
    file: ../secrets/wp_admin_password.txt

  wp_user_password:
    file: ../secrets/wp_user_password.txt

# Define persistent storage for the database and WordPress on the VM.
volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      device: /home/wheino/data/mariadb
      o: bind

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      device: /home/wheino/data/wordpress
      o: bind

# Define the network our containers will share.
networks:
  inception:
    driver: bridge